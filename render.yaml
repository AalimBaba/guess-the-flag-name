services:
  - type: web
    name: guess-the-flag-name-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CLIENT_URL
        value: https://aalimbaba.github.io
      - key: MONGO_DB
        value: guess_flags
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
